[package]
name = "render"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
winit = ["dep:winit"]
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
geometry = { path = "../geometry" }
space = { path = "../space" }
render-macros = { path = "../render-macros" }
log = "0.4.20"
image = { version = "0.24", default-features = false, features = [
    "png",
    "jpeg",
] }
wgpu = { version = "0.17" }
bytemuck = { version = "1.12", features = ["derive"] }
tobj = { version = "3.2.1", features = ["async"] }
rand = "0.8.5"
futures-intrusive = "0.5.0"
parking_lot = "0.12.1"
pollster = "0.3"
winit = { version = "0.29.3", features = ["rwh_05"], optional = true }
egui = { version = "0.23.0", optional = true }
egui-wgpu = { version = "0.23.0", optional = true }
auto_ops = "0.3.0"
byteorder = "1.5.0"

[build-dependencies]
build-deps = { version = "0.1.4" }
