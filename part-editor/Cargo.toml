[package]
name = "part-editor"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
space = { path = "../space" }
visual = { path = "../visual" }
tessellate = { path = "../tessellate" }
geometry = { path = "../geometry" }
render = { path = "../render", features = ["egui"] }
eframe = { version = "0.23.0", features = ["wgpu"] }
env_logger = "0.10"
bytemuck = "1.14.0"
async-once-cell = "0.5.3"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"
